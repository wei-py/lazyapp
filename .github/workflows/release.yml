name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun run smoke:release
      - uses: actions/upload-artifact@v4
        with:
          name: lazyapp-darwin-arm64
          path: |
            dist/lazyapp-darwin-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lazyapp-darwin-arm64
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/lazyapp-darwin-arm64.tar.gz dist/SHA256SUMS
          --verify-tag --title "$RELEASE_TAG" --generate-notes
          --notes 'macOS Apple Silicon (arm64). Install: mise use -g github:wei-py/lazyapp@latest. Bun is bundled; no separate runtime installation is required.'

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build lazyapp-${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: darwin-arm64
          - os: macos-15-intel
            asset: darwin-x64
          - os: ubuntu-22.04
            asset: linux-x64
          - os: ubuntu-22.04-arm
            asset: linux-arm64
          - os: windows-latest
            asset: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun run smoke:release
      - uses: actions/upload-artifact@v4
        with:
          name: lazyapp-${{ matrix.asset }}
          path: dist/lazyapp-${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lazyapp-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum lazyapp-* > SHA256SUMS
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/lazyapp-* dist/SHA256SUMS
          --verify-tag --title "$RELEASE_TAG" --generate-notes
          --notes 'Prebuilt binaries for macOS (Apple Silicon/x86_64), Linux (x86_64/aarch64), and Windows (x86_64). Install: mise use -g github:wei-py/lazyapp@latest. Bun is bundled; no separate runtime installation is required.'

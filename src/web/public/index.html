<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LazyApp · 本地工作区</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">跳到主要内容</a>
  <div id="app">
    <header class="topbar">
      <button id="toggle-navigation" type="button" aria-controls="workspace-navigation" aria-expanded="false">导航</button>
      <strong class="brand">LazyApp</strong>
      <div class="workspace"><span class="local-dot" aria-hidden="true"></span><span id="root">正在连接本地服务…</span></div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <div class="layout">
      <div id="navigation-slot"><aside id="workspace-navigation" class="sidebar scroll-section" data-scroll-section tabindex="0" aria-label="工作区导航">
        <div class="navigation-heading"><strong>工作区 <span id="document-count" class="count">—</span></strong><button id="new-document" type="button" class="small">新建配置</button></div>
        <div class="search"><label class="search-label" for="document-search">查找配置</label><input id="document-search" type="search" placeholder="名称、类型或路径" autocomplete="off"></div>
        <div id="document-list" class="document-list">
          <section class="navigation-panel" aria-labelledby="app-navigation-title"><h2 id="app-navigation-title">App / 资源</h2><div id="app-documents"></div></section>
          <section class="navigation-panel" aria-labelledby="platform-navigation-title"><h2 id="platform-navigation-title">平台</h2><div id="platform-documents"></div></section>
          <section class="navigation-panel" aria-label="服务、环境与商店">
            <div id="collection-tabs" class="collection-tabs" role="tablist" aria-label="配置分类">
              <button id="service-tab" type="button" role="tab" data-collection="service" aria-controls="service-documents" aria-selected="true">服务</button>
              <button id="environment-tab" type="button" role="tab" data-collection="environment" aria-controls="environment-documents" aria-selected="false" tabindex="-1">环境</button>
              <button id="store-tab" type="button" role="tab" data-collection="store" aria-controls="store-documents" aria-selected="false" tabindex="-1">商店</button>
            </div>
            <div id="service-documents" role="tabpanel" aria-labelledby="service-tab"><div id="service-list"></div></div>
            <div id="environment-documents" role="tabpanel" aria-labelledby="environment-tab" hidden><div id="environment-list"></div></div>
            <div id="store-documents" role="tabpanel" aria-labelledby="store-tab" hidden><div id="store-list"></div></div>
          </section>
        </div>
        <section class="navigation-panel tools-panel" aria-labelledby="tools-title"><h2 id="tools-title">工具</h2><nav id="navigation" aria-label="工作区工具"><button type="button" data-view="files"><span>文件与材料</span><span id="file-count" class="count">—</span></button><button type="button" data-view="doctor"><span>Doctor</span><span class="nav-tag">诊断</span></button></nav></section>
      </aside></div>
      <main id="content" data-scroll-root tabindex="0" aria-label="工作区内容">
        <section id="documents-view" aria-label="配置编辑器">
          <div id="editor" class="editor"><div class="empty"><h1>选择配置</h1></div></div>
        </section>
        <section id="files-view" aria-labelledby="files-title" hidden>
          <div class="section-heading"><div><h1 id="files-title" tabindex="-1">文件与材料</h1><div class="path">assets / 工作区文件</div></div><span class="badge">原始文件</span></div>
          <section class="panel" aria-labelledby="upload-title"><h2 id="upload-title">导入文件</h2><form id="upload-form" class="upload-form"><label>本地文件<input id="upload-source" type="file" required></label><label class="grow">工作区相对目标路径<input id="upload-destination" type="text" placeholder="assets/materials/营业执照.pdf" required autocomplete="off" spellcheck="false"></label><button class="primary" type="submit">导入文件</button></form></section>
          <div id="file-list" class="file-list"></div>
        </section>
        <section id="doctor-view" aria-labelledby="doctor-title" hidden>
          <div class="section-heading"><div><h1 id="doctor-title" tabindex="-1">Doctor</h1><div class="path">工作区 / 只读检查</div></div><button id="run-doctor" class="primary" type="button">运行诊断</button></div>
          <p class="hint diagnostic-scope">检查配置与文件引用，不验证证书或远程凭据。</p>
          <div id="doctor-results" class="panel"><div id="doctor-summary" class="doctor-summary"></div><div id="doctor-list"><p class="hint">尚未运行诊断。</p></div></div>
        </section>
      </main>
    </div>
    <footer>
      <div class="status-copy"><span id="activity" role="status" aria-live="polite">正在连接…</span><div id="notice" class="notice scroll-section" role="status" aria-label="操作结果" aria-live="polite" tabindex="0" hidden></div></div>
      <span class="keyboard-hint"><kbd>⌘ / Ctrl S</kbd> 保存 · 本地工作区</span>
    </footer>
  </div>
  <button id="back-to-top" type="button" class="local-floating" aria-label="返回内容顶部" hidden>↑ 顶部</button>
  <dialog id="navigation-drawer" aria-label="工作区导航">
    <div class="drawer-heading"><strong>工作区导航</strong><button id="close-navigation" type="button">关闭</button></div>
  </dialog>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
</body>
</html>
